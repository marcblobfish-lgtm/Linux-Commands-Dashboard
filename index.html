<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐧 Linux Befehls-Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --terminal-bg: #0a0a0a;
            --terminal-header: #1a1a1a;
            --terminal-border: #2a2a2a;
            --green: #00ff41;
            --green-dim: #00cc33;
            --amber: #ffb000;
            --amber-dim: #cc8800;
            --white: #e0e0e0;
            --gray: #888;
            --red: #ff4444;
            --cyan: #00ffff;
        }

        body {
            font-family: 'Fira Code', monospace;
            background-color: #000;
            color: var(--green);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Scanline Effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        /* Header */
        .terminal-header {
            background: var(--terminal-header);
            border-bottom: 2px solid var(--green);
            padding: 0.8rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .terminal-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .terminal-dots {
            display: flex;
            gap: 0.5rem;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot.red { background: var(--red); }
        .dot.yellow { background: var(--amber); }
        .dot.green { background: var(--green); }

        .terminal-label {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .terminal-label span {
            color: var(--green);
        }

        /* Stats */
        .stats-bar {
            background: #0f0f0f;
            border-bottom: 1px solid var(--terminal-border);
            padding: 0.6rem 1.5rem;
            display: flex;
            gap: 2rem;
            font-size: 0.85rem;
            color: var(--gray);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-value {
            color: var(--amber);
            font-weight: 600;
        }

        /* Main Container */
        .main-container {
            display: flex;
            min-height: calc(100vh - 120px);
        }

        /* Sidebar - Categories as Tabs */
        .sidebar {
            width: 280px;
            background: var(--terminal-header);
            border-right: 2px solid var(--green);
            overflow-y: auto;
            flex-shrink: 0;
        }

        .category-tabs {
            display: flex;
            flex-direction: column;
        }

        .category-tab {
            padding: 1rem 1.5rem;
            cursor: pointer;
            border-bottom: 1px solid var(--terminal-border);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.9rem;
            color: var(--gray);
        }

        .category-tab:hover {
            background: rgba(0, 255, 65, 0.1);
            color: var(--white);
        }

        .category-tab.active {
            background: rgba(0, 255, 65, 0.15);
            color: var(--green);
            border-left: 4px solid var(--green);
            font-weight: 600;
        }

        .tab-icon {
            font-size: 1.3rem;
        }

        .tab-count {
            margin-left: auto;
            background: rgba(0, 255, 65, 0.2);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            color: var(--green);
        }

        .category-tab.active .tab-count {
            background: var(--green);
            color: #000;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            max-height: calc(100vh - 120px);
        }

        .active-category-header {
            background: #0f0f0f;
            padding: 1rem 1.5rem;
            border-bottom: 2px solid var(--amber);
            margin: -1.5rem -1.5rem 1.5rem -1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .active-category-title {
            font-size: 1.3rem;
            color: var(--amber);
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .command-count {
            color: var(--gray);
            font-size: 0.9rem;
        }

        /* Command Grid */
        .command-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1rem;
        }

        .command-card {
            background: #0a0a0a;
            border: 1px solid var(--terminal-border);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.2s;
            position: relative;
        }

        .command-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--terminal-border);
            transition: background 0.2s;
        }

        .command-card:hover {
            border-color: var(--green);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 65, 0.1);
        }

        .command-card:hover::before {
            background: var(--green);
        }

        .command-header {
            padding: 0.8rem 1rem;
            background: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--terminal-border);
        }

        .command-text {
            color: var(--green);
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .prompt-symbol {
            color: var(--amber);
            font-weight: 700;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--terminal-border);
            color: var(--gray);
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: var(--green);
            color: #000;
            border-color: var(--green);
        }

        .copy-btn.copied {
            background: var(--amber);
            border-color: var(--amber);
            color: #000;
        }

        .command-description {
            padding: 0.7rem 1rem;
            color: var(--gray);
            font-size: 0.8rem;
            line-height: 1.5;
        }

        .command-description::before {
            content: '$ ';
            color: var(--amber);
        }

        /* Search Bar */
        .search-container {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #0a0a0a;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--terminal-border);
        }

        .search-input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            background: #111;
            border: 1px solid var(--terminal-border);
            border-radius: 6px;
            color: var(--green);
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--green);
        }

        .search-input::placeholder {
            color: #555;
        }

        .search-wrapper {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        .quick-btn {
            background: #111;
            border: 1px solid var(--terminal-border);
            color: var(--gray);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            border-color: var(--green);
            color: var(--green);
            background: rgba(0, 255, 65, 0.1);
        }

        /* Animations */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .cursor {
            animation: blink 1s infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .command-card {
            animation: fadeIn 0.3s ease-out;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 2px solid var(--green);
                max-height: 200px;
            }

            .category-tabs {
                flex-direction: row;
                overflow-x: auto;
            }

            .category-tab {
                white-space: nowrap;
                border-bottom: none;
                border-right: 1px solid var(--terminal-border);
            }

            .content-area {
                max-height: none;
            }

            .command-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--green-dim);
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 3rem;
            color: var(--gray);
        }

        .no-results-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--green);
            color: #000;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Terminal Header -->
    <div class="terminal-header">
        <div class="terminal-title">
            <div class="terminal-dots">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="terminal-label">root@debian:~/commands <span class="cursor">_</span></div>
        </div>
        <div style="color: var(--gray); font-size: 0.8rem;">v2.0 Terminal Edition</div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
        <div class="stat-item">📁 Kategorien: <span class="stat-value" id="catCount">0</span></div>
        <div class="stat-item">💻 Befehle: <span class="stat-value" id="cmdCount">0</span></div>
        <div class="stat-item">📊 Kategorie: <span class="stat-value" id="currentCat">Alle</span></div>
    </div>

    <div class="main-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <div class="category-tabs" id="categoryTabs">
                <!-- Tabs will be inserted here by JS -->
            </div>
        </div>

        <!-- Main Content -->
        <div class="content-area">
            <!-- Search -->
            <div class="search-container">
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="searchInput" placeholder="Befehl suchen... (z.B. 'update', 'systemctl')">
                </div>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="filterByCategory('system')">System</button>
                    <button class="quick-btn" onclick="filterByCategory('apt')">APT</button>
                    <button class="quick-btn" onclick="filterByCategory('network')">Netzwerk</button>
                    <button class="quick-btn" onclick="filterByCategory('docker')">Docker</button>
                    <button class="quick-btn" onclick="filterByCategory('security')">Sicherheit</button>
                </div>
            </div>

            <!-- Active Category Header -->
            <div class="active-category-header">
                <div class="active-category-title">
                    <span id="activeIcon">🐧</span>
                    <span id="activeCategoryName">Alle Befehle</span>
                </div>
                <div class="command-count" id="commandCount">0 Befehle</div>
            </div>

            <!-- Command Grid -->
            <div class="command-grid" id="commandGrid">
                <!-- Commands will be inserted here by JS -->
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">✅ Befehl kopiert!</div>

    <script>
        // Command Data
        const commands = [
            // Systemverwaltung
            { category: 'system', icon: '⚙️', command: 'whoami', description: 'Zeigt den aktuellen Benutzernamen' },
            { category: 'system', icon: '⚙️', command: 'date', description: 'Zeigt aktuelles Datum und Uhrzeit' },
            { category: 'system', icon: '⚙️', command: 'uptime', description: 'Zeigt an, wie lange das System läuft' },
            { category: 'system', icon: '⚙️', command: 'hostname', description: 'Zeigt den Hostnamen des Systems' },
            { category: 'system', icon: '⚙️', command: 'uname -a', description: 'Zeigt alle Systeminformationen (Kernel, Architektur, etc.)' },
            { category: 'system', icon: '⚙️', command: 'lscpu', description: 'Zeigt detaillierte CPU-Informationen' },
            { category: 'system', icon: '⚙️', command: 'free -h', description: 'Zeigt den Speicherverbrauch in human-readable Format' },
            { category: 'system', icon: '⚙️', command: 'df -h', description: 'Zeigt belegten und freien Speicherplatz' },
            { category: 'system', icon: '⚙️', command: 'lsblk', description: 'Zeigt alle Blockgeräte (Festplatten, Partitionen)' },
            { category: 'system', icon: '⚙️', command: 'top', description: 'Echtzeit-Monitoring der Systemressourcen' },
            { category: 'system', icon: '⚙️', command: 'htop', description: 'Interaktiver Prozess-Viewer (muss installiert werden)' },
            { category: 'system', icon: '⚙️', command: 'dmesg', description: 'Zeigt Kernel-Messages' },

            // APT Paketverwaltung
            { category: 'apt', icon: '📦', command: 'sudo apt update', description: 'Aktualisiert die Paketlisten' },
            { category: 'apt', icon: '📦', command: 'sudo apt upgrade', description: 'Aktualisiert alle installierten Pakete' },
            { category: 'apt', icon: '📦', command: 'sudo apt install [paket]', description: 'Installiert ein Paket (z.B. nginx, curl)' },
            { category: 'apt', icon: '📦', command: 'sudo apt remove [paket]', description: 'Deinstalliert ein Paket' },
            { category: 'apt', icon: '📦', command: 'sudo apt autoremove', description: 'Entfernt nicht mehr benötigte Abhängigkeiten' },
            { category: 'apt', icon: '📦', command: 'sudo apt full-upgrade', description: 'Komplettes Systemupgrade (auch mit Paketwechsel)' },
            { category: 'apt', icon: '📦', command: 'apt list --installed', description: 'Listet alle installierten Pakete' },
            { category: 'apt', icon: '📦', command: 'apt search [suchbegriff]', description: 'Sucht nach Paketen' },
            { category: 'apt', icon: '📦', command: 'dpkg -l | grep [suchbegriff]', description: 'Sucht nach installierten Paketen' },
            { category: 'apt', icon: '📦', command: 'sudo apt clean', description: 'Löscht heruntergeladene .deb-Dateien' },
            { category: 'apt', icon: '📦', command: 'sudo dpkg -i [paket].deb', description: 'Installiert ein lokales .deb-Paket' },
            { category: 'apt', icon: '📦', command: 'apt-cache policy [paket]', description: 'Zeigt Installationsstatus und Versionen' },

            // Systemctl/Dienste
            { category: 'services', icon: '🔄', command: 'systemctl status [dienst]', description: 'Prüft den Status eines Dienstes' },
            { category: 'services', icon: '🔄', command: 'sudo systemctl start [dienst]', description: 'Startet einen Dienst' },
            { category: 'services', icon: '🔄', command: 'sudo systemctl stop [dienst]', description: 'Stoppet einen Dienst' },
            { category: 'services', icon: '🔄', command: 'sudo systemctl restart [dienst]', description: 'Startet einen Dienst neu' },
            { category: 'services', icon: '🔄', command: 'sudo systemctl enable [dienst]', description: 'Aktiviert einen Dienst zum Starten beim Booten' },
            { category: 'services', icon: '🔄', command: 'sudo systemctl disable [dienst]', description: 'Deaktiviert einen Dienst vom Starten beim Booten' },
            { category: 'services', icon: '🔄', command: 'systemctl list-units --type=service', description: 'Listet alle Dienste auf' },
            { category: 'services', icon: '🔄', command: 'journalctl -u [dienst]', description: 'Zeigt Logs eines Dienstes' },
            { category: 'services', icon: '🔄', command: 'systemctl list-units --state=failed', description: 'Zeigt alle fehlgeschlagenen Dienste' },

            // Dateiverwaltung
            { category: 'files', icon: '📁', command: 'ls -la', description: 'Listet alle Dateien detailliert auf' },
            { category: 'files', icon: '📁', command: 'cd [verzeichnis]', description: 'Wechselt in ein Verzeichnis' },
            { category: 'files', icon: '📁', command: 'mkdir [name]', description: 'Erstellt ein neues Verzeichnis' },
            { category: 'files', icon: '📁', command: 'mkdir -p [pfad]', description: 'Erstellt Verzeichnis mit allen Eltern-Verzeichnissen' },
            { category: 'files', icon: '📁', command: 'rm [datei]', description: 'Löscht eine Datei' },
            { category: 'files', icon: '📁', command: 'rm -r [verzeichnis]', description: 'Löscht ein Verzeichnis rekursiv' },
            { category: 'files', icon: '📁', command: 'cp [quelle] [ziel]', description: 'Kopiert eine Datei' },
            { category: 'files', icon: '📁', command: 'cp -r [quelle] [ziel]', description: 'Kopiert ein Verzeichnis rekursiv' },
            { category: 'files', icon: '📁', command: 'mv [quelle] [ziel]', description: 'Verschiebt/umbenennt eine Datei' },
            { category: 'files', icon: '📁', command: 'touch [datei]', description: 'Erstellt eine leere Datei' },
            { category: 'files', icon: '📁', command: 'cat [datei]', description: 'Zeigt den Inhalt einer Datei' },
            { category: 'files', icon: '📁', command: 'find / -name [suchbegriff]', description: 'Sucht nach Dateien im System' },
            { category: 'files', icon: '📁', command: 'du -sh [verzeichnis]', description: 'Zeigt den Speicherplatz eines Verzeichnisses' },
            { category: 'files', icon: '📁', command: 'wc -l [datei]', description: 'Zählt Zeilen in einer Datei' },
            { category: 'files', icon: '📁', command: 'tail -f [datei]', description: 'Überwacht eine Datei in Echtzeit' },
            { category: 'files', icon: '📁', command: 'head -n 10 [datei]', description: 'Zeigt die ersten 10 Zeilen' },
            { category: 'files', icon: '📁', command: 'ln -s [ziel] [link]', description: 'Erstellt einen symbolischen Link' },
            { category: 'files', icon: '📁', command: 'pwd', description: 'Zeigt den aktuellen Pfad' },

            // Netzwerk
            { category: 'network', icon: '🌐', command: 'ip a', description: 'Zeigt alle Netzwerkinterfaces' },
            { category: 'network', icon: '🌐', command: 'ip addr show', description: 'Zeigt IP-Adressen der Interfaces' },
            { category: 'network', icon: '🌐', command: 'ip route', description: 'Zeigt die Routing-Tabelle' },
            { category: 'network', icon: '🌐', command: 'ping [host]', description: 'Testet die Erreichbarkeit' },
            { category: 'network', icon: '🌐', command: 'ifconfig', description: 'Zeigt Netzwerkkonfiguration (wenn installiert)' },
            { category: 'network', icon: '🌐', command: 'netstat -tuln', description: 'Zeigt offene Ports' },
            { category: 'network', icon: '🌐', command: 'ss -tuln', description: 'Moderne Alternative zu netstat' },
            { category: 'network', icon: '🌐', command: 'curl ifconfig.me', description: 'Zeigt die öffentliche IP-Adresse' },
            { category: 'network', icon: '🌐', command: 'wget [url]', description: 'Lädt Dateien aus dem Internet herunter' },
            { category: 'network', icon: '🌐', command: 'nslookup [domain]', description: 'Löst Domain-Namen in IPs auf' },
            { category: 'network', icon: '🌐', command: 'traceroute [host]', description: 'Zeigt den Weg der Pakete' },
            { category: 'network', icon: '🌐', command: 'dig [domain]', description: 'DNS-Abfrage (modernere Alternative zu nslookup)' },
            { category: 'network', icon: '🌐', command: 'ssh user@host', description: 'Verbindet sich per SSH zu einem Server' },
            { category: 'network', icon: '🌐', command: 'scp [quelle] [ziel]', description: 'Kopiert Dateien per SSH' },
            { category: 'network', icon: '🌐', command: 'wget -O - https://example.com', description: 'Lädt und zeigt Inhalt direkt an' },

            // Berechtigungen
            { category: 'permissions', icon: '🔐', command: 'chmod 755 [datei]', description: 'Ändert Dateiberechtigungen' },
            { category: 'permissions', icon: '🔐', command: 'chmod -R 755 [verzeichnis]', description: 'Ändert Berechtigungen rekursiv' },
            { category: 'permissions', icon: '🔐', command: 'chown [nutzer]:[gruppe] [datei]', description: 'Ändert den Datei-Eigentümer' },
            { category: 'permissions', icon: '🔐', command: 'sudo chown -R [nutzer]:[gruppe] [verzeichnis]', description: 'Ändert Eigentümer rekursiv' },
            { category: 'permissions', icon: '🔐', command: 'sudo useradd -m [nutzer]', description: 'Erstellt einen neuen Benutzer' },
            { category: 'permissions', icon: '🔐', command: 'sudo usermod -aG sudo [nutzer]', description: 'Fügt Benutzer zur sudo-Gruppe hinzu' },
            { category: 'permissions', icon: '🔐', command: 'sudo passwd [nutzer]', description: 'Ändert das Passwort eines Benutzers' },
            { category: 'permissions', icon: '🔐', command: 'sudo visudo', description: 'Bearbeiten der sudoers-Datei' },
            { category: 'permissions', icon: '🔐', command: 'chmod +x [skript]', description: 'Macht ein Skript ausführbar' },
            { category: 'permissions', icon: '🔐', command: 'su - [nutzer]', description: 'Wechselt den Benutzer' },
            { category: 'permissions', icon: '🔐', command: 'groups', description: 'Zeigt alle Gruppen des aktuellen Benutzers' },

            // Git
            { category: 'git', icon: '🔀', command: 'git init', description: 'Initialisiert ein neues Git-Repository' },
            { category: 'git', icon: '🔀', command: 'git clone [url]', description: 'Klont ein Repository' },
            { category: 'git', icon: '🔀', command: 'git add .', description: 'Fügt alle Änderungen zur Staging-Area hinzu' },
            { category: 'git', icon: '🔀', command: 'git commit -m "Nachricht"', description: 'Kommitiert Änderungen mit Nachricht' },
            { category: 'git', icon: '🔀', command: 'git push -u origin main', description: 'Pushed Änderungen zu Remote' },
            { category: 'git', icon: '🔀', command: 'git pull', description: 'Holt und merged Änderungen von Remote' },
            { category: 'git', icon: '🔀', command: 'git status', description: 'Zeigt den aktuellen Status' },
            { category: 'git', icon: '🔀', command: 'git branch', description: 'Listet alle Branches' },
            { category: 'git', icon: '🔀', command: 'git checkout -b [name]', description: 'Erstellt und wechselt zu neuem Branch' },
            { category: 'git', icon: '🔀', command: 'git log --oneline', description: 'Zeigt Commit-History kompakt' },
            { category: 'git', icon: '🔀', command: 'git merge [branch]', description: 'Mergt einen Branch in den aktuellen' },
            { category: 'git', icon: '🔀', command: 'git stash', description: 'Zwischenspeichert unvercomitete Änderungen' },
            { category: 'git', icon: '🔀', command: 'git diff', description: 'Zeigt Änderungen im Detail' },

            // Docker
            { category: 'docker', icon: '🐳', command: 'sudo docker ps', description: 'Zeigt alle laufenden Container' },
            { category: 'docker', icon: '🐳', command: 'sudo docker images', description: 'Zeigt alle Docker-Images' },
            { category: 'docker', icon: '🐳', command: 'sudo docker pull [image]', description: 'Lädt ein Docker-Image herunter' },
            { category: 'docker', icon: '🐳', command: 'sudo docker run -d -p 80:80 [image]', description: 'Startet einen Container im Hintergrund' },
            { category: 'docker', icon: '🐳', command: 'sudo docker stop [container]', description: 'Stoppt einen Container' },
            { category: 'docker', icon: '🐳', command: 'sudo docker rm [container]', description: 'Löscht einen Container' },
            { category: 'docker', icon: '🐳', command: 'sudo docker logs [container]', description: 'Zeigt die Logs eines Containers' },
            { category: 'docker', icon: '🐳', command: 'sudo docker build -t [name] .', description: 'Baut ein neues Docker-Image' },
            { category: 'docker', icon: '🐳', command: 'sudo docker exec -it [container] bash', description: 'Öffnet Shell im laufenden Container' },
            { category: 'docker', icon: '🐳', command: 'sudo docker-compose up -d', description: 'Startet Docker-Compose Services im Hintergrund' },
            { category: 'docker', icon: '🐳', command: 'sudo docker system prune', description: 'Bereinigt nicht mehr genutzte Docker-Ressourcen' },

            // Firewall
            { category: 'security', icon: '🛡️', command: 'sudo ufw status', description: 'Zeigt den Status der UFW-Firewall' },
            { category: 'security', icon: '🛡️', command: 'sudo ufw allow 80', description: 'Ermöglicht Port 80' },
            { category: 'security', icon: '🛡️', command: 'sudo ufw enable', description: 'Aktiviert die UFW-Firewall' },
            { category: 'security', icon: '🛡️', command: 'sudo ufw disable', description: 'Deaktiviert die UFW-Firewall' },
            { category: 'security', icon: '🛡️', command: 'sudo ufw allow ssh', description: 'Ermöglicht SSH-Zugriff' },
            { category: 'security', icon: '🛡️', command: 'sudo ufw deny 23', description: 'Blockiert Port 23 (Telnet)' },
            { category: 'security', icon: '🛡️', command: 'sudo ufw delete allow 80', description: 'Entfernt Regel für Port 80' },
            { category: 'security', icon: '🛡️', command: 'sudo ufw reload', description: 'Lädt Firewall-Regeln neu' },

            // Cron Jobs
            { category: 'cron', icon: '⏰', command: 'crontab -e', description: 'Bearbeiten der Cron-Jobs' },
            { category: 'cron', icon: '⏰', command: 'crontab -l', description: 'Listet die Cron-Jobs' },
            { category: 'cron', icon: '⏰', command: '0 5 * * * /script.sh', description: 'Cron-Beispiel: Jeden Tag um 5 Uhr' },
            { category: 'cron', icon: '⏰', command: '*/5 * * * * /script.sh', description: 'Alle 5 Minuten ausführen' },
            { category: 'cron', icon: '⏰', command: 'sudo service cron restart', description: 'Startet den Cron-Dienst neu' },
            { category: 'cron', icon: '⏰', command: 'crontab -r', description: 'Löscht alle Cron-Jobs' },

            // Logs & Debugging
            { category: 'logs', icon: '📋', command: 'journalctl -xe', description: 'Zeigt die neuesten Systemlogs' },
            { category: 'logs', icon: '📋', command: 'tail -f /var/log/syslog', description: 'Überwacht Logs in Echtzeit' },
            { category: 'logs', icon: '📋', command: 'cat /var/log/auth.log', description: 'Zeigt Authentifizierungslogs' },
            { category: 'logs', icon: '📋', command: 'grep -i "error" /var/log/syslog', description: 'Sucht nach "error" in Logs' },
            { category: 'logs', icon: '📋', command: 'dmesg | tail', description: 'Zeigt Kernel-Logs' },
            { category: 'logs', icon: '📋', command: 'lsof -i :80', description: 'Zeigt Prozesse auf Port 80' },
            { category: 'logs', icon: '📋', command: 'sudo tail -n 50 /var/log/syslog', description: 'Zeigt die letzten 50 Zeilen' },
            { category: 'logs', icon: '📋', command: 'journalctl --since "2024-01-01"', description: 'Zeigt Logs ab einem bestimmten Datum' },

            // Prozess-Management
            { category: 'process', icon: '📊', command: 'ps aux', description: 'Zeigt alle laufenden Prozesse' },
            { category: 'process', icon: '📊', command: 'ps -ef | grep [prozess]', description: 'Sucht nach einem spezifischen Prozess' },
            { category: 'process', icon: '📊', command: 'kill [pid]', description: 'Tötet einen Prozess' },
            { category: 'process', icon: '📊', command: 'kill -9 [pid]', description: 'Erzwingt das Beenden eines Prozesses' },
            { category: 'process', icon: '📊', command: 'pkill [prozess]', description: 'Tötet Prozesse nach Name' },
            { category: 'process', icon: '📊', command: 'bg', description: 'Setzt gestoppte Prozesse fort' },
            { category: 'process', icon: '📊', command: 'fg', description: 'Holt Prozess zurück in den Vordergrund' },
            { category: 'process', icon: '📊', command: 'nohup [befehl] &', description: 'Startet Prozess, der im Hintergrund bleibt' },
        ];

        // Category Metadata
        const categoryMeta = {
            system: { name: 'Systemverwaltung', icon: '⚙️' },
            apt: { name: 'Paketverwaltung (APT)', icon: '📦' },
            services: { name: 'Systemctl & Dienste', icon: '🔄' },
            files: { name: 'Dateiverwaltung', icon: '📁' },
            network: { name: 'Netzwerk', icon: '🌐' },
            permissions: { name: 'Berechtigungen', icon: '🔐' },
            git: { name: 'Git & Version Control', icon: '🔀' },
            docker: { name: 'Docker', icon: '🐳' },
            security: { name: 'Firewall & Sicherheit', icon: '🛡️' },
            cron: { name: 'Cron Jobs', icon: '⏰' },
            logs: { name: 'Logs & Debugging', icon: '📋' },
            process: { name: 'Prozess-Management', icon: '📊' }
        };

        let currentCategory = 'all';
        let searchTerm = '';

        // Initialize
        function init() {
            renderCategoryTabs();
            renderCommands();
            updateStats();

            // Search input
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchTerm = e.target.value.toLowerCase();
                renderCommands();
            });
        }

        // Render Category Tabs
        function renderCategoryTabs() {
            const tabsContainer = document.getElementById('categoryTabs');
            const categories = [...new Set(commands.map(c => c.category))];

            let html = `
                <div class="category-tab ${currentCategory === 'all' ? 'active' : ''}" onclick="filterByCategory('all')">
                    <span class="tab-icon">🐧</span>
                    <span>Alle Befehle</span>
                    <span class="tab-count">${commands.length}</span>
                </div>
            `;

            categories.forEach(cat => {
                const meta = categoryMeta[cat];
                const count = commands.filter(c => c.category === cat).length;
                html += `
                    <div class="category-tab ${currentCategory === cat ? 'active' : ''}" onclick="filterByCategory('${cat}')">
                        <span class="tab-icon">${meta.icon}</span>
                        <span>${meta.name}</span>
                        <span class="tab-count">${count}</span>
                    </div>
                `;
            });

            tabsContainer.innerHTML = html;
        }

        // Filter by Category
        function filterByCategory(category) {
            currentCategory = category;
            renderCategoryTabs();
            renderCommands();
            updateStats();

            // Scroll to content on mobile
            if (window.innerWidth <= 768) {
                document.querySelector('.content-area').scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Render Commands
        function renderCommands() {
            const grid = document.getElementById('commandGrid');
            const countEl = document.getElementById('commandCount');
            const nameEl = document.getElementById('activeCategoryName');
            const iconEl = document.getElementById('activeIcon');

            let filtered = commands;

            // Filter by category
            if (currentCategory !== 'all') {
                filtered = filtered.filter(c => c.category === currentCategory);
            }

            // Filter by search
            if (searchTerm) {
                filtered = filtered.filter(c =>
                    c.command.toLowerCase().includes(searchTerm) ||
                    c.description.toLowerCase().includes(searchTerm)
                );
            }

            // Update header
            if (currentCategory === 'all') {
                nameEl.textContent = 'Alle Befehle';
                iconEl.textContent = '🐧';
            } else {
                const meta = categoryMeta[currentCategory];
                nameEl.textContent = meta.name;
                iconEl.textContent = meta.icon;
            }

            countEl.textContent = `${filtered.length} Befehl${filtered.length !== 1 ? 'e' : ''}`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="no-results" style="grid-column: 1 / -1;">
                        <div class="no-results-icon">🔍</div>
                        <div>Keine Befehle gefunden</div>
                        <div style="margin-top: 0.5rem; font-size: 0.8rem;">Versuche einen anderen Suchbegriff</div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map((cmd, index) => `
                <div class="command-card" style="animation-delay: ${index * 0.02}s">
                    <div class="command-header">
                        <div class="command-text">
                            <span class="prompt-symbol">$</span>
                            ${escapeHtml(cmd.command)}
                        </div>
                        <button class="copy-btn" onclick="copyCommand(this, '${escapeForAttr(cmd.command)}')">Kopieren</button>
                    </div>
                    <div class="command-description">${escapeHtml(cmd.description)}</div>
                </div>
            `).join('');
        }

        // Copy Command
        function copyCommand(btn, command) {
            navigator.clipboard.writeText(command).then(() => {
                btn.textContent = 'Kopiert!';
                btn.classList.add('copied');
                showToast();

                setTimeout(() => {
                    btn.textContent = 'Kopieren';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = command;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);

                btn.textContent = 'Kopiert!';
                btn.classList.add('copied');
                showToast();

                setTimeout(() => {
                    btn.textContent = 'Kopieren';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        // Show Toast
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // Update Stats
        function updateStats() {
            document.getElementById('catCount').textContent = Object.keys(categoryMeta).length;
            document.getElementById('cmdCount').textContent = commands.length;
            const meta = currentCategory === 'all' ? { name: 'Alle' } : categoryMeta[currentCategory];
            document.getElementById('currentCat').textContent = meta.name || meta;
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Escape for attribute
        function escapeForAttr(text) {
            return text.replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
